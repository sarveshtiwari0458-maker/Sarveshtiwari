name: Fix portfolio details

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-details:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update email and graduation year
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('sarveshtiwari0456@gmail.com', 'sarveshtiwari0458@gmail.com')
          s = s.replace('2028', '2029')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix portfolio email and graduation year'
          git push
